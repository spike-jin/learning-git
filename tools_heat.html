<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>运动热量计算</title>
    
    <style>

    /*热量计算器*/
       .breadcrumb {
        display: flex;
        gap: 12px;
        margin: 0px 0 0 5.5%;
        font: 14px/1.5 'Microsoft Yahei';
        color: #666;
        list-style: none;
        transform: translateX(-30px);
    }
    
    .breadcrumb a {
        color:#ff8b33;
        text-decoration: none;  
        transition: all 0.3s ease;
    }
    
    .breadcrumb a:hover {
        color: #ff8b33;
        text-decoration: underline;  
        text-underline-offset: 3px;
    }
    
    .breadcrumb li:not(:last-child)::after {
        content: '/';
        margin-left: 12px;
        color: currentColor;
    }
    
    .active {
        color: #2c2928;
        cursor: default;
    }
    
    @keyframes underline {
        from { width: 0 }
        to { width: 100% }
    }
    .breadcrumb {
        width: 100%;
        height: 20px;
        background-color: #f0f8ff;
    }
    .introduction-box{
            font-family: Arial, sans-serif;
            background-color: #f0f8ff;
            padding: 50px;
        }
        .calculator input[type="number"] {
    width: 100%;
    padding: 8px;
    box-sizing: border-box;
    margin: 18px 0; /* 添加上下间距 */
}
        .calculator {
            max-width: 400px;
            background-color: #fff;
            padding: 30px;
            margin: auto;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
            width: 50%;  
            text-align: center;
            margin: 0 auto; 
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        select, input[type="number"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            width: 36%;  
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
            text-align: center;
            margin: 18px auto 0;  
            display: block;  
        }
        button:hover {
            background-color: #45a049;
        }
        .result {
            margin-top: 20px;
            padding: 10px;
            background-color: #e7f4e9;
            border-left: 5px solid #66bb6a;
            text-align: center;  
        }
        .result {
    transition: opacity 0.3s ease;
         }
    </style>
</head>
<body>

    <!-- 主内容 -->
    <main class="container-heat">
        <div class="introduction-box">

            <div class="content-heat">
                <h2>运动热量计算</h2>
                <form id="calorieForm">
                    <div class="form-group">
                        <label for="activity">选择活动类型:</label>
                        <select id="activity" required>
                            <option value="">--请选择活动--</option>
                            <option value="walking">步行 (5 km/h)</option>
                            <option value="running">跑步 (10 km/h)</option>
                            <option value="cycling">骑自行车 (15 km/h)</option>
                            <option value="swimming">游泳</option>
                            <option value="skiping">跳绳(150/min)</option>
                        </select>
                    </div>
                
                    <div class="form-group">
                        <label for="duration">活动时间 (分钟):</label>
                        <input type="number" id="duration" min="1" required>
                    </div>
                
                    <div class="form-group">
                        <label for="weight">体重 (公斤):</label>
                        <input type="number" id="weight" min="10" required>
                    </div>
                
                    <button type="submit">计算热量</button>
                </form>
                
                <div class="result" id="result"></div>          
                        </div>
                    </div>
            </div>
        </div>
    </main>

    <script>
        // 计算器功能
        document.getElementById('calorieForm').addEventListener('submit', function(e) {
        e.preventDefault(); // 防止表单提交刷新页面

        const activity = document.getElementById('activity').value;
        const duration = parseFloat(document.getElementById('duration').value);
        const weight = parseFloat(document.getElementById('weight').value);

        if (!activity || isNaN(duration) || isNaN(weight)) {
            document.getElementById('result').innerText = '请填写所有字段。';
            return;
        }

        // 每公斤体重每小时消耗的大致热量（千卡）
        const MET = {
            walking: 3.5,
            running: 7,
            cycling: 6,
            swimming: 8,
            gym: 5
        };

        const caloriesPerHour = MET[activity] * weight;
        const caloriesBurned = (caloriesPerHour / 60) * duration;

        document.getElementById('result').innerText = `您在 ${duration} 分钟的 ${document.getElementById('activity').options[document.getElementById('activity').selectedIndex].text} 中大约消耗了 ${caloriesBurned.toFixed(1)} 千卡的热量。`;
    });
    </script>
</body>
</html>
