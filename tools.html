<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>计算器</title>
    <style>

        /* tools主内容模块 */
        .container-tools {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .tools-section {
            margin-top: 30px;
        }
        
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        
        .tool-module {
            position: relative;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            background-color: #2c3e50;
            color: white;
            text-decoration: none;
            height: 200px;
        }
        
        .tool-module img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .tool-title {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            text-align: center;
            padding: 15px;
            background-color: rgba(0, 0, 0, 0.6);
            font-size: 20px;
        }
    </style>
</head>
<body>

    <!-- 主内容 -->
    <div class="container-tools">
        <div class="tools-section">
            <div class="tools-grid">
                <a href="equipment_detail.html" class="tool-module">
                    <img src="#" alt="运动热量计算">
                    <div class="tool-title">运动热量计算</div>
                </a>
                <a href="forum.html" class="tool-module">
                    <img src="#" alt="BNI热量计算">
                    <div class="tool-title">BNI热量计算</div>
                </a>
            </div>
        </div>
    </div>



</body>
</html>
